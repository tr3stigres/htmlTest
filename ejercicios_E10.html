		<div class ="row mt-1" id="juego" name="juego">

			</div>
			<div class="col-6 d-flex align-items-center">				
				<button type="button" class="btn btn-primary" id="jugar" name="jugar" onclick="jugar()">Valida letra</button>
			</div>

			</div>
			<div class="col-6 d-flex align-items-end">
				<button type="button" class="btn btn-primary" id="reiniciar" name="reiniciar" onclick="reiniciar()" disabled>Otra partida</button>
			</div>
		</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
