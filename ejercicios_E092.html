<!doctype html>
<html lang="es">
	<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
      <meta charset="utf-8">
		<title>E092 - Ejercicios de JavaScript</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<script src="E092.js"></script>
		<link rel="stylesheet" href="E092.css">
	</head>
	<body>
	<main id="fondo" class="container form-field">
		<h1>E092 - Ejercicios de JavaScript</h1>
		<div class ="row mt-5">
			<h2 class="mb-3">Selecciona color</h2>
			<div class="col-12 col-md-2">
				<button type="button" class="btn btn-primary" onclick="repintar('#FFFFFF')">Blanco</button>
			</div>
			<div class="col-12 col-md-2">
				<button type="button" class="btn btn-primary" onclick="repintar('#000000')">Negro</button>
			</div>
			<div class="col-12 col-md-2">
				<button type="button" class="btn btn-primary" onclick="repintar('#0000FF')">Azul</button>
			</div>
			<div class="col-12 col-md-2">
				<button type="button" class="btn btn-primary" onclick="repintar('#FF0000')">Rojo</button>
			</div>
			<div class="col-12 col-md-2">
				<button type="button" class="btn btn-primary" onclick="repintar('#008000')">Verde</button>
			</div>
			<div id="cuadro" name="cuadro" class="col-12 col-md-2 cuadro">
				&nbsp;
			</div>
		</div>	
		<div class="col-12 mt-3">
			<h2>Selecciona zona</h2>
			<p>Selecciona si quieres cambiar el fondo o solo el cuadro</p>
			<div class="form-check">				
				<input type="radio" class="form-check-input" id="fondo" name="zona" value="fondo" checked>Fondo
				<label class="form-check-label" for="fondo"></label>
			</div>
			<div class="form-check">
			  <input type="radio" class="form-check-input" id="cuadro" name="zona" value="cuadro">Cuadro
			  <label class="form-check-label" for="cuadro"></label>
			</div>
		</div>
		
		
	</main>		
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	</body>
</html>
