<!doctype html>
<html lang="es">
	<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
      <meta charset="utf-8">
		<title>E07 - Función potencia en Javascript</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<script src="E07.js"></script>
	</head>
	<body>
	<main class="container form-field">
		<h1>E07 - Función potencia en Javascript</h1>
		<div class ="row">
			<div class="col-12 col-md-6">
				<label for="base" class="form-label">Base</label>
				<input id="base" name="base" placeholder="Introduce el valor de la base" class="form-control" type="text">
			</div>
			<div class="col-12 col-md-6">
				<label for="exponente" class="form-label">Exponente</label>
				<input id="exponente" name="exponente"  placeholder="Introduce el valor al que se elevará la base" class="form-control" type="text">
			</div>
		</div>
		<div class ="row mt-5">
			<div class="col-12 col-md-6">
				<button type="button" class="btn btn-primary" onclick="calculo()">Calcular</button>
			</div>
		</div>
		<div class ="row mt-5">
			<div class="col-12 col-md-6">
				<label for="resultado" class="form-label">Resultado</label>
				<input id="resultado" name="resultado" class="form-control" type="text" readonly>
			</div>
		</div>		
		
		
	</main>	
	
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	</body>
</html>
